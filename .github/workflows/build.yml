# ==============================================================================
# TÉCNICA DE TESTING / SEGURIDAD: SAST (Static Application Security Testing)
# + Verificación de Calidad, Tipos y Cobertura (SonarCloud Quality Gate)
# ==============================================================================
# Propósito:
#   Análisis estático de código fuente propio ("Caja Blanca" / White-box) sin ejecutar
#   la aplicación en un entorno de producción o runtime.
# Rol en la arquitectura:
#   - Calidad y Tipos: Comprobación estricta de compilación y tipos (tsc / npm run typecheck).
#   - SonarCloud / SonarQube: Análisis de seguridad (OWASP Top 10, CWEs), detección de
#     Bugs, Vulnerabilidades y Security Hotspots, y verificación del Quality Gate con
#     el reporte de cobertura de Jest (test:cov > 80%).
# Momento de activación:
#   - En cada push a ramas principales (master, main) y de características.
#   - En cada Pull Request al abrirse o sincronizarse.
# ==============================================================================

name: Build
on:
  push:
    branches:
      - master
      - main
      - feature/cambio-arquitectura
      - feature/multitenant-core-fixes
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  quality:
    name: Calidad (tipos y compilación)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      # Validación de tipos del código de aplicación y de las pruebas de
      # integración: cualquier error de tipos rompe la compilación.
      - name: Validación de tipos
        run: npm run typecheck
      - name: Compilación
        run: npm run build

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      # Suite de pruebas unitarias con informe de cobertura (el análisis de
      # SonarCloud consume este informe).
      - name: Run Tests with Coverage
        run: npm run test:cov
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  multitenant:
    name: Multitenant (MariaDB real)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      # Levanta un contenedor MariaDB efímero (el runner de ubuntu-latest
      # dispone de Docker), aplica las migraciones reales del proyecto y
      # ejecuta la suite de integración multitenant: aislamiento de consultas,
      # autenticación por negocio, catálogos, configuración por negocio y la
      # SUITE NEGATIVA de aislamiento entre negocios.
      #
      # `MARIADB_TEST_SKIP` NO se define a propósito: con Docker disponible las
      # pruebas se ejecutan de verdad contra MariaDB.
      - name: Ejecutar pruebas de integración multitenant
        run: npm run test:multitenant
