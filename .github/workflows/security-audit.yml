# ==============================================================================
# TÉCNICA DE TESTING / SEGURIDAD: SCA (Software Composition Analysis)
# Subtipo: Quality Gate / Bloqueador de Seguridad en CI/CD (OWASP A06 / A03)
# ==============================================================================
# Propósito:
#   Auditoría de composición de dependencias de terceros y librerías open-source (npm).
# Rol en la arquitectura:
#   Actúa como "Inspector / Bloqueador de Pipeline". Examina el árbol completo de
#   paquetes en package-lock.json. Si se detectan vulnerabilidades conocidas (CVEs)
#   de nivel ALTO o CRÍTICO, falla la ejecución (código de salida > 0) y bloquea
#   la integración o despliegue del backend.
# Momento de activación:
#   - En cada push a ramas principales (master, main).
#   - En cada Pull Request.
#   - Programado periódicamente (cron semanal: lunes a la medianoche).
# ==============================================================================

name: Security Audit Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  schedule:
    - cron: '0 0 * * 1' # Ejecutar cada lunes

jobs:
  npm-audit:
    name: OWASP A03 Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias exactas
        run: npm ci

      - name: Escaneo de Seguridad (Falla si hay vulnerabilidades Altas o Críticas)
        # Umbral `high`: la auditoría de dependencias no puede dejar pasar
        # vulnerabilidades altas. En el momento de subir este umbral, la
        # auditoría del árbol de dependencias declarado en package-lock.json
        # devolvía 0 vulnerabilidades (también con `--audit-level=low`), de
        # modo que endurecerlo no oculta ningún problema preexistente: si
        # aparece una vulnerabilidad, la CI falla.
        run: npm audit --audit-level=high
