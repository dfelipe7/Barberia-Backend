# =============================================================================
# FASE 11 - ENTORNO LOCAL MULTITENANT AISLADO (MySQL 8.0)
# =============================================================================
#
# Este archivo es INDEPENDIENTE del entorno original (`bd_barberia`, que sigue
# en su propio contenedor/volume). No comparte red, ni volumen, ni base de
# datos, ni credenciales con el entorno original.
#
#   - No se ejecuta `docker compose down -v` sobre el entorno original.
#   - El volumen `barberia_multitenant_dev_data` es NUEVO: no reutiliza
#     `proyectoii_barberia_db_data`.
#   - La base es `bd_barberia_multitenant_dev` en el puerto 3308.
#
# Uso (desde la raiz del repositorio):
#
#   1) Preparar las variables locales (NO se versionan):
#        copy .env.multitenant-dev.example .env.multitenant-dev   # Windows
#        # Linux/macOS: cp .env.multitenant-dev.example .env.multitenant-dev
#      y editar la contrasena.
#
#   2) Levantar SOLO la instancia MySQL aislada:
#        docker compose -f docker-compose.multitenant-dev.yml up -d mysql-multitenant-dev
#
#   3) Aplicar las migraciones de forma EXPLICITA (nunca al arrancar):
#        npm run db:migrate:dev
#
#   4) Consultar el estado del historial:
#        npm run db:migrate:status:dev
#
# El servicio `migrador-multitenant-dev` esta tras el perfil `migrador`: no
# arranca con `docker compose up` y solo se ejecuta bajo demanda:
#
#        docker compose -f docker-compose.multitenant-dev.yml --profile migrador run --rm migrador-multitenant-dev
# =============================================================================

name: barberia-multitenant-dev

services:
  # ---------------------------------------------------------------------------
  # MySQL 8.0 AISLADO para el desarrollo multitenant.
  # Puerto 3308 en el host: no choca con el 3307 del entorno original.
  # ---------------------------------------------------------------------------
  mysql-multitenant-dev:
    image: mysql:8.0.46
    container_name: barberia-mysql-multitenant-dev
    restart: unless-stopped
    env_file:
      # Credenciales PROPIAS del entorno aislado. `env_file` NO se interpola:
      # sus valores llegan tal cual al contenedor (root y base).
      - .env.multitenant-dev
    command:
      # `lower_case_table_names=0` = comportamiento de un servidor Linux: los
      # nombres de tabla NO se normalizan. Es el modo exigido por el historial
      # de migraciones (mezcla `Administrador` y `administrador`).
      - --lower-case-table-names=0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3308:3306"
    volumes:
      - barberia_multitenant_dev_data:/var/lib/mysql
    networks:
      - barberia_multitenant_dev_net
    healthcheck:
      # Healthcheck AUTENTICADO: no basta con que el puerto responda.
      test:
        ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ---------------------------------------------------------------------------
  # MIGRADOR EXPLICITO (perfil `migrador`).
  #
  # - Usa la MISMA imagen del proyecto (Dockerfile), de modo que las binarias
  #   Linux de Prisma 7 y sus dependencias vienen del `npm ci` real. No se
  #   monta el codigo sobre un `node:alpine` generico.
  # - NO se ejecuta al hacer `docker compose up`: vive tras el perfil
  #   `migrador` y hay que invocarlo expresamente.
  # - Si una migracion falla, el proceso termina con codigo != 0 y NO intenta
  #   ninguna alternativa destructiva (no hay `db push` de respaldo).
  # - Solo puede alcanzar `bd_barberia_multitenant_dev`: es la unica base a la
  #   que la red `barberia_multitenant_dev_net` da acceso.
  # ---------------------------------------------------------------------------
  migrador-multitenant-dev:
    profiles:
      - migrador
    build:
      context: .
      dockerfile: Dockerfile
    image: barberia-backend:migrador-multitenant-dev
    restart: "no"
    env_file:
      - .env.multitenant-dev
    command:
      - sh
      - -c
      # `$$` escapa la interpolacion de Compose: las variables se expanden
      # DENTRO del contenedor con los valores de `.env.multitenant-dev`.
      - >-
        export DATABASE_URL="mysql://root:$${MYSQL_ROOT_PASSWORD}@mysql-multitenant-dev:3306/$${MYSQL_DATABASE}";
        npx prisma migrate deploy
    depends_on:
      mysql-multitenant-dev:
        condition: service_healthy
    networks:
      - barberia_multitenant_dev_net

volumes:
  # `name:` fija el nombre EXACTO del volumen: no se prefija con el nombre del
  # proyecto y, sobre todo, no puede colisionar con `proyectoii_barberia_db_data`.
  barberia_multitenant_dev_data:
    name: barberia_multitenant_dev_data

networks:
  barberia_multitenant_dev_net:
    name: barberia_multitenant_dev_net
    driver: bridge
